  <line x1="34" y1="30" x2="74" y2="80" stroke="#15130F" stroke-opacity="0.22" stroke-width="1.4"/>
  <g>
    <circle cx="34" cy="30" r="5" fill="#15130F"/>
    <circle cx="34" cy="30" r="2.1" fill="#D6A94F"/>
    <circle cx="80" cy="38" r="5" fill="#15130F"/>
    <circle cx="80" cy="38" r="2.1" fill="#D6A94F"/>
    <circle cx="74" cy="80" r="5" fill="#15130F"/>
    <circle cx="74" cy="80" r="2.1" fill="#D6A94F"/>
    <circle cx="28" cy="70" r="5" fill="#15130F"/>
    <circle cx="28" cy="70" r="2.1" fill="#D6A94F"/>
  </g>
