<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">
  <defs>
    <linearGradient id="plot" x1="34" y1="30" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D6A94F"/>
      <stop offset="1" stop-color="#BE5A2E"/>
